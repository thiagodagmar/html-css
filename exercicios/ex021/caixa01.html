<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>

    <style>
        h1 {
            background-color: rgb(208, 241, 241);
            height: 300px;
            width: 300px;
 
            border: 10px solid aqua;

            
            padding: 10px 20px;

            margin: 20px auto 40px auto;
            
            outline-width: 3px;
            outline-style: solid;
            outline-color: blue;
            
        }

        a {
            display: block;
            border-width: 10px;
            border-style: solid;
            border-color: blueviolet;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }



        
    </style>


</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
