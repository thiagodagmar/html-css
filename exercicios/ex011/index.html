<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.png">
        <source media="(max-width:1050px)" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio src="audio/cartoon-audio.mp3"  controls autoplay></audio>
    <!--Aceita MP3, WAV e OGG-->
    <audio preload="metadata" controls loop>
        <source src="audio/cartoon-audio.mp3" type="audio/mpeg">
        <source src="audio/cartoon-audio.mp3" type="audio/ogg">
        <source src="audio/cartoon-audio.mp3" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="audio/cartoon-audio.mp3">Clique aqui</a> para baixar o arquivo MP3</p>
    </audio>
   
</body>
</html>
