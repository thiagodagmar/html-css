<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            border-collapse: collapse;
        }
        
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        td {
            text-align: center;
        }
        
        .tb-title {
            background-color: gray;
            color: white;
        }
        
    </style>
</head>
<body>
    <table>
        <tr class="tb-title">
            <th rowspan="2" scope="col">Área</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Média</th>
        </tr>
        <tr class="tb-title">
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
        </tr>
        <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Matemática</td>
            <td>8.0</td>
            <td>10.0</td>
            <td>9.0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td>7.0</td>
            <td>8.0</td>
            <td>7.5</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>10.0</td>
            <td>9.0</td>
            <td>9.5</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>8.0</td>
            <td>9.0</td>
            <td>8.5</td>
        </tr>
        <tr class="tb-title">
            <th colspan="4" scope="row">Média de exatas</th>
            <td>8.6</td>
        </tr>
        <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>História</td>
            <td>7.0</td>
            <td>8.0</td>
            <td>7.5</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>8.0</td>
            <td>9.0</td>
            <td>8.5</td>
        </tr>
        <tr class="tb-title">
            <th colspan="4" scope="row">Média de humanas</th>
            <td>8.6</td>
        </tr>


    </table>
    
</body>
</html>
